<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ares – Baskets Omni 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F4F4F6; --ink:#111114; --muted:#6A6A75; --line:#E4E4E9;
  --accent:#2A3FE8; --on-accent:#FFFFFF; --shoe:#2A3FE8; --sole:#FFFFFF; --stroke:rgba(0,0,0,.12);
  --display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0C10; --surface:#17171D; --ink:#F2F2F5; --muted:#9C9CAA; --line:#2A2A33;
    --accent:#6F82FF; --on-accent:#0C0C10; --sole:#E9E9EE; --stroke:rgba(255,255,255,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0C10; --surface:#17171D; --ink:#F2F2F5; --muted:#9C9CAA; --line:#2A2A33;
  --accent:#6F82FF; --on-accent:#0C0C10; --sole:#E9E9EE; --stroke:rgba(255,255,255,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;overflow-x:hidden;transition:background .35s,color .35s}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(55rem 38rem at 85% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 65%),radial-gradient(40rem 30rem at -5% 60%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 65%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(color-mix(in srgb,var(--ink) 18%,transparent) 1px,transparent 1.2px);background-size:28px 28px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent 70%);mask-image:linear-gradient(to bottom,#000,transparent 70%)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 1.25rem}

header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem .7rem .6rem 1.2rem;margin-top:.9rem;border-radius:999px;background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);position:sticky;top:calc(.6rem + env(safe-area-inset-top,0px));z-index:5}
.logo{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.03em;text-decoration:none}
nav{display:flex;gap:1.5rem;margin-left:auto}
nav a{text-decoration:none;color:var(--muted);font-weight:500;transition:color .2s}
nav a:hover{color:var(--ink)}
.tools{display:flex;gap:.5rem;align-items:center}
.icon-btn{position:relative;width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.icon-btn:active{transform:scale(.88)}
.icon-btn svg{width:1.3rem;height:1.3rem;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.icon-btn.spin svg{transform:rotate(360deg)}
.sun{display:none}
:root[data-theme="dark"] .sun{display:block}
:root[data-theme="dark"] .moon{display:none}
#count{position:absolute;top:-.3rem;right:-.3rem;min-width:1.3rem;height:1.3rem;padding:0 .3rem;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.75rem;font-weight:500;display:grid;place-items:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
#count.on{transform:scale(1)}
#count.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.5)}}

.hero .wrap{text-align:center;padding-top:3rem;padding-bottom:2.5rem}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,7vw,5.2rem);line-height:.98;letter-spacing:-.04em;margin:0 0 1.25rem}
.lead{max-width:34ch;color:var(--muted);margin:0 0 1.75rem}
.btn{position:relative;overflow:hidden;display:inline-block;border:0;font:inherit;font-weight:500;cursor:pointer;background:var(--ink);color:var(--bg);padding:.9rem 1.7rem;border-radius:999px;text-decoration:none;transition:transform .15s,box-shadow .2s}
.btn:hover{box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 25%,transparent)}
.btn:active{transform:scale(.94)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.3;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.shoe{stroke:var(--stroke);stroke-width:2;transition:fill .4s}

section{padding:4.5rem 0}
h2{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,4vw,2.8rem);letter-spacing:-.03em;line-height:1.05;margin:0 0 2rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.card{background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:26px;overflow:hidden;border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px color-mix(in srgb,var(--ink) 12%,transparent)}
.card .img{padding:1.5rem 1rem;background:color-mix(in srgb,var(--ink) 4%,transparent)}
.card svg{width:100%;height:auto;display:block;transition:transform .35s}
.card:hover svg{transform:rotate(-5deg) scale(1.05)}
.txt{padding:1.1rem 1.25rem 1.4rem}
.card h3{font-family:var(--display);font-size:1.35rem;margin:0}
.card p{margin:.2rem 0 1rem;color:var(--muted);font-size:.98rem}
.row2{display:flex;align-items:center;justify-content:space-between}
.price{font-weight:500}
.add{padding:.6rem 1.1rem;font-size:.95rem}
.add.done{background:var(--accent);color:var(--on-accent)}



footer{padding:2.5rem 0 3rem;color:var(--muted);font-size:.95rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem}

@media (max-width:760px){
  .hero .wrap{grid-template-columns:1fr;padding-top:1.5rem;padding-bottom:2.5rem;gap:1rem}
  .stage{order:-1}
  .tools{margin-left:auto}
  .grid,.values{grid-template-columns:1fr}
  .lead{max-width:none}
  .hero .btn{display:block;text-align:center;width:100%}
  section{padding:3rem 0}
  .news{padding:2.25rem 1.25rem;border-radius:26px}
  .news input,.news .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.sub{max-width:none;margin:-1rem 0 2rem;color:var(--muted)}
.card .img{position:relative;overflow:hidden;background:#09090C;padding:0;aspect-ratio:277/194}
.card .img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .img img{transform:scale(1.06)}
.card .txt{padding:1rem 1.1rem 1.2rem}
.color{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.95rem;margin:.25rem 0 .9rem}
.color i{width:.9rem;height:.9rem;border-radius:50%;box-shadow:0 0 0 1px var(--line);flex:none}
.row2{margin-bottom:.8rem;gap:.5rem}
.price{font-family:var(--display);font-weight:800;font-size:1.3rem}
select{font:inherit;font-size:.95rem;padding:.5rem 1.8rem .5rem .8rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
select.err{outline:2px solid var(--accent);outline-offset:2px;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.add{width:100%;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s;z-index:19}
.ov.open{opacity:1;visibility:visible;transition:opacity .3s}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(430px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:1.5rem}
.items{flex:1;overflow-y:auto;padding:.5rem 1.25rem}
.empty{color:var(--muted);text-align:center;margin-top:3rem}
.line{display:flex;gap:.8rem;align-items:center;padding:.9rem 0;border-bottom:1px solid var(--line);animation:inn .3s}
@keyframes inn{from{opacity:0;transform:translateX(16px)}}
.line img{width:84px;height:58px;object-fit:cover;border-radius:12px;background:#09090C;flex:none}
.li{flex:1;display:flex;flex-direction:column;font-size:.92rem;line-height:1.35;min-width:0}
.li span{color:var(--muted)}
.li .lp{color:var(--ink);font-weight:500}
.qty{display:flex;align-items:center;gap:.5rem}
.qty button{width:1.9rem;height:1.9rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;transition:transform .15s}
.qty button:active{transform:scale(.8)}
.foot{padding:1rem 1.25rem 1.25rem;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.7rem}
.foot[hidden]{display:none}
.promo{display:flex;gap:.5rem}
.promo input{flex:1;min-width:0;padding:.7rem 1rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-transform:uppercase}
.promo .btn{padding:.7rem 1.2rem}
.pm{min-height:1.4em;font-size:.9rem;color:var(--muted)}
.pm button{border:0;background:none;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.tr{display:flex;justify-content:space-between}
.tr.total{font-family:var(--display);font-weight:800;font-size:1.4rem}
.full{width:100%;text-align:center}
.done{display:none;padding:3rem 1.5rem;text-align:center}
.done h2{margin:1rem 0 .5rem}
.done p{color:var(--muted);margin:0 0 1.5rem}
.done .ck{width:4.5rem;height:4.5rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:inline-grid;place-items:center;font-size:2.2rem;animation:pop2 .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop2{from{transform:scale(0)}}
.ordered .items,.ordered .foot{display:none}
.ordered .done{display:block}
@media (max-width:760px){
  .grid{grid-template-columns:repeat(2,1fr);gap:.8rem}
  .card{border-radius:20px}
  .card .txt{padding:.8rem .8rem 1rem}
  .card h3{font-size:1.1rem}
  .color{font-size:.85rem;margin-bottom:.7rem}
  .row2{flex-direction:column;align-items:flex-start}
  select{width:100%}
  .add{padding:.65rem .5rem;font-size:.9rem}
  .price{font-size:1.2rem}
}

.checkout{display:none;flex:1;overflow-y:auto;padding:1rem 1.25rem 1.5rem}
.checkout h3{font-family:var(--display);font-size:1.3rem;margin:.8rem 0 1rem}
.checkout label{display:block;font-size:.88rem;color:var(--muted);margin-bottom:.7rem}
.checkout input{width:100%;margin-top:.25rem;padding:.75rem 1rem;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 .6rem}
.back{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.cosum{display:flex;flex-direction:column;gap:.5rem;margin:1.2rem 0 1rem;padding-top:1rem;border-top:1px solid var(--line)}
.co .items,.co .foot{display:none}
.co .checkout{display:block}

[hidden]{display:none!important}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.send{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem;text-align:left}
.send textarea{width:100%;padding:.8rem 1rem;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem;resize:none}
h1.ares{font-family:var(--display);font-weight:800;font-size:clamp(4.5rem,22vw,11rem);line-height:1;letter-spacing:-.04em;margin:0}
.hero .lead{max-width:none;margin:1rem auto 0;text-align:center}
#contact{min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 0}
#contact h2{margin-bottom:1.5rem}
.ig-btn{display:inline-flex;align-items:center;gap:.6rem}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <a class="logo" href="#">Ares</a>
    <nav aria-label="Navigation principale">
      <a href="#modeles">Modèles</a>
      <a href="#contact">Insta</a>
    </nav>
    <div class="tools">
      <button class="icon-btn" id="cart" aria-label="Panier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span id="count">0</span></button>
      <button class="icon-btn" id="theme" aria-label="Changer le thème">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
</div>

<div class="hero">
  <div class="wrap">
    <h1 class="ares">Ares</h1>
    <p class="lead">Les baskets Omni 9, du 36 au 47.</p>
  </div>
</div>

<main class="wrap">
  <section id="modeles">
    <h2>Les modèles du moment</h2>
    <p class="lead sub">Saucony Omni 9 · tailles 36 à 47 · 80 € la paire</p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <a class="btn ig-btn" href="https://www.instagram.com/shop2ares/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg>Instagram</a>
  </section>
</main>

<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer" aria-label="Panier" aria-hidden="true">
  <div class="dh"><h2>Mon panier</h2><button class="icon-btn" id="close" aria-label="Fermer le panier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="items" id="items"></div>
  <div class="foot" id="foot" hidden>
    <form class="promo" id="pf"><input id="pc" placeholder="Code promo" aria-label="Code promo" autocomplete="off"><button class="btn" type="submit">Appliquer</button></form>
    <div class="pm" id="pm" role="status"></div>
    <div id="tot"></div>
    <button class="btn full" id="order">Commander</button>
  </div>
  <form class="checkout" id="cf">
    <button type="button" class="back" id="back">← Retour au panier</button>
    <h3>Informations de livraison</h3>
    <div class="f2"><label>Prénom<input name="prenom" required autocomplete="given-name"></label><label>Nom<input name="nom" required autocomplete="family-name"></label></div>
    <label>E-mail<input type="email" name="email" required autocomplete="email"></label>
    <label>Téléphone<input type="tel" name="tel" required autocomplete="tel"></label>
    <label>Adresse<input name="adr" required autocomplete="address-line1" placeholder="Numéro et rue"></label>
    <label>Complément d’adresse (facultatif)<input name="adr2" autocomplete="address-line2" placeholder="Bâtiment, étage, digicode"></label>
    <div class="f2"><label>Code postal<input name="cp" required autocomplete="postal-code"></label><label>Ville<input name="ville" required autocomplete="address-level2"></label></div>
    <label>Pays<input name="pays" required value="France" autocomplete="country-name"></label>
    <div class="cosum" id="cosum"></div>
    <button class="btn full" type="submit">Confirmer la commande</button>
  </form>
  <div class="done"><div class="ck">✓</div><h2 id="dttl">Merci pour ta commande !</h2><p id="dmsg"></p><div class="send">
      <a class="btn full ghost" id="ig" target="_blank" rel="noopener" hidden>Envoyer sur Instagram</a>
      <textarea id="omsg" readonly rows="8" aria-label="Récapitulatif de la commande"></textarea>
      <button type="button" class="btn full ghost" id="copy">Copier le message</button>
    </div>
    <button class="btn full" id="again">Continuer mes achats</button></div>
</aside>
<footer class="wrap">
  <span>© 2026 Ares</span>

<script>
(function(){
  var root=document.documentElement;
  // Thème
  var saved=null;
  try{saved=localStorage.getItem('theme')}catch(e){}
  var dark=saved?saved==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme',dark?'dark':'light');
  var tb=document.getElementById('theme');
  tb.addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('theme',next)}catch(e){}
    tb.classList.remove('spin');void tb.offsetWidth;tb.classList.add('spin');
  });
  // Effet d’onde sur les boutons
  document.addEventListener('click',function(e){
    var b=e.target.closest('.btn');if(!b)return;
    var r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)/4,sp=document.createElement('span');
    sp.className='rip';sp.style.width=sp.style.height=s+'px';
    sp.style.left=(e.clientX-r.left-s/2)+'px';sp.style.top=(e.clientY-r.top-s/2)+'px';
    b.appendChild(sp);setTimeout(function(){sp.remove()},600);
  });
  // Modèles et panier
  var P=[['Rose fuchsia','#E5338C'],['Argent irisé','#B9BEC6'],['Rouge carmin','#D81F3C'],['Bleu nuit','#27406B'],['Bleu et lime','#2F6FB5'],['Blanc et orange','#F2A33A'],['Gris clair','#B4B6BC'],['Rose pastel','#F0A6D2'],['Noir et turquoise','#1F5F66']];
  var PRICE=80;
  var CODES={ARES96:{p:10,t:'-10 %'}};
  function eur(n){return (Math.round(n*100)/100).toFixed(2).replace('.',',').replace(',00','')+' €';}
  var sizes='<option value="">Taille</option>';
  for(var z=36;z<=47;z++)sizes+='<option>'+z+'</option>';
  var grid=document.getElementById('grid');
  grid.innerHTML=P.map(function(p,i){
    return '<article class="card"><div class="img"><img src="'+IMG[i]+'" alt="Saucony Omni 9 '+p[0]+'" loading="lazy"></div>'+
    '<div class="txt"><h3>Omni 9</h3><div class="color"><i style="background:'+p[1]+'"></i>'+p[0]+'</div>'+
    '<div class="row2"><select data-i="'+i+'" aria-label="Taille, '+p[0]+'">'+sizes+'</select><span class="price">'+eur(PRICE)+'</span></div>'+
    '<button class="btn add" data-i="'+i+'">Ajouter au panier</button></div></article>';
  }).join('');

  var cart=[],promo='',perr='';
  try{cart=JSON.parse(localStorage.getItem('cart')||'[]');promo=localStorage.getItem('promo')||''}catch(e){cart=[]}
  if(!Array.isArray(cart))cart=[];
  cart=cart.filter(function(l){return l&&P[l.i]&&l.q>0});
  if(!CODES[promo])promo='';
  function save(){try{localStorage.setItem('cart',JSON.stringify(cart));localStorage.setItem('promo',promo)}catch(e){}}
  function totals(){
    var q=0;cart.forEach(function(l){q+=l.q});
    var sub=q*PRICE,d=0,c=CODES[promo];
    if(c&&q>=(c.min||0))d=c.p?sub*c.p/100:Math.min(c.a,sub);
    return {q:q,sub:sub,d:d,tot:sub-d};
  }
  var count=document.getElementById('count'),box=document.getElementById('items'),foot=document.getElementById('foot'),pm=document.getElementById('pm'),tot=document.getElementById('tot');
  function render(){
    var t=totals();
    count.textContent=t.q;count.classList.toggle('on',t.q>0);
    foot.hidden=!cart.length;
    if(!cart.length){box.innerHTML='<p class="empty">Ton panier est vide.<br>Ajoute une paire pour commencer.</p>';return}
    box.innerHTML=cart.map(function(l,k){
      return '<div class="line"><img src="'+IMG[l.i]+'" alt=""><div class="li"><b>Omni 9</b><span>'+P[l.i][0]+' · Taille '+l.s+'</span><span class="lp">'+eur(PRICE*l.q)+'</span></div>'+
      '<div class="qty"><button data-a="m" data-k="'+k+'" aria-label="Retirer une paire">−</button><span>'+l.q+'</span><button data-a="p" data-k="'+k+'" aria-label="Ajouter une paire">+</button></div></div>';
    }).join('');
    var c=CODES[promo];
    if(promo){pm.innerHTML=(t.q>=(c.min||0)?'Code '+promo+' appliqué ('+c.t+')':'Code '+promo+' : valable dès '+c.min+' paires')+' <button type="button" id="rm">Retirer</button>'}
    else pm.textContent=perr;
    tot.innerHTML='<div class="tr"><span>Sous-total</span><span>'+eur(t.sub)+'</span></div>'+(t.d?'<div class="tr"><span>Réduction</span><span>-'+eur(t.d)+'</span></div>':'')+'<div class="tr total"><span>Total</span><span>'+eur(t.tot)+'</span></div>';
  }
  var dr=document.getElementById('drawer'),ov=document.getElementById('ov'),lastF=null;
  function openCart(){lastF=document.activeElement;dr.classList.add('open');ov.classList.add('open');dr.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.getElementById('close').focus()}
  function closeCart(){dr.classList.remove('open');ov.classList.remove('open');dr.setAttribute('aria-hidden','true');document.body.style.overflow='';if(lastF)lastF.focus()}
  document.getElementById('cart').addEventListener('click',openCart);
  document.getElementById('close').addEventListener('click',closeCart);
  ov.addEventListener('click',closeCart);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&dr.classList.contains('open'))closeCart()});

  grid.addEventListener('change',function(e){if(e.target.tagName==='SELECT')e.target.classList.remove('err')});
  grid.addEventListener('click',function(e){
    var b=e.target.closest('.add');if(!b)return;
    var i=+b.dataset.i,sel=grid.querySelector('select[data-i="'+i+'"]');
    if(!sel.value){sel.classList.remove('err');void sel.offsetWidth;sel.classList.add('err');sel.focus();return}
    var l=null;cart.forEach(function(x){if(x.i===i&&x.s===sel.value)l=x});
    if(l)l.q++;else cart.push({i:i,s:sel.value,q:1});
    perr='';save();render();
    dr.classList.remove('ordered','co');count.classList.remove('bump');void count.offsetWidth;count.classList.add('bump');
    b.textContent='Ajouté ✓';b.classList.add('done');
    setTimeout(function(){b.textContent='Ajouter au panier';b.classList.remove('done')},1400);
  });
  box.addEventListener('click',function(e){
    var b=e.target.closest('button[data-a]');if(!b)return;
    var l=cart[+b.dataset.k];if(!l)return;
    if(b.dataset.a==='p')l.q++;else l.q--;
    if(l.q<=0)cart.splice(+b.dataset.k,1);
    save();render();
  });
  pm.addEventListener('click',function(e){if(e.target.id==='rm'){promo='';perr='';save();render()}});
  document.getElementById('pf').addEventListener('submit',function(e){
    e.preventDefault();
    var inp=document.getElementById('pc'),v=inp.value.trim().toUpperCase();
    if(!v)return;
    var c=CODES[v],q=totals().q;
    if(!c)perr='Ce code n’existe pas.';
    else if(q<(c.min||0))perr='Ce code est valable dès '+c.min+' paires.';
    else{promo=v;perr='';inp.value=''}
    save();render();
  });
  var cf=document.getElementById('cf');
  document.getElementById('order').addEventListener('click',function(){
    if(!totals().q)return;
    document.getElementById('cosum').innerHTML=tot.innerHTML;
    dr.classList.add('co');cf.scrollTop=0;
    var first=cf.querySelector('input');if(first)first.focus();
  });
  document.getElementById('back').addEventListener('click',function(){dr.classList.remove('co')});
  var IG='shop2ares';
  function copyMsg(){var ta=document.getElementById('omsg');ta.select();try{navigator.clipboard.writeText(ta.value)}catch(e){}try{document.execCommand('copy')}catch(e){}}
  document.getElementById('copy').addEventListener('click',function(){var b=this;copyMsg();b.textContent='Copié ✓';setTimeout(function(){b.textContent='Copier le message'},1400)});
  document.getElementById('ig').addEventListener('click',copyMsg);
  cf.addEventListener('submit',function(e){
    e.preventDefault();
    var t=totals();if(!t.q)return;
    var f=new FormData(cf),ref='ARES-'+Math.floor(10000+Math.random()*90000);
    var adr=f.get('adr')+(f.get('adr2')?', '+f.get('adr2'):'')+', '+f.get('cp')+' '+f.get('ville')+', '+f.get('pays');
    var lines=cart.map(function(l){return '- Omni 9 '+P[l.i][0]+', taille '+l.s+' x'+l.q+' ('+eur(PRICE*l.q)+')'});
    var msg='Commande '+ref+'\n'+lines.join('\n')+(promo&&t.d?'\nCode promo '+promo+' : -'+eur(t.d):'')+'\nTotal : '+eur(t.tot)+'\n\nLivraison :\n'+f.get('prenom')+' '+f.get('nom')+'\n'+adr+'\nTél : '+f.get('tel')+'\nE-mail : '+f.get('email');
    document.getElementById('omsg').value=msg;
    var ig=document.getElementById('ig');
    if(IG){ig.href='https://ig.me/m/'+IG;ig.hidden=false}else ig.hidden=true;
    document.getElementById('dttl').textContent='Merci '+f.get('prenom')+' !';
    document.getElementById('dmsg').textContent='Commande '+ref+' · '+t.q+(t.q>1?' paires':' paire')+' · total '+eur(t.tot)+'. Dernière étape : envoie-la à Ares pour qu’elle soit validée.';
    cart=[];promo='';perr='';save();render();cf.reset();
    dr.classList.remove('co');dr.classList.add('ordered');
  });
  document.getElementById('again').addEventListener('click',function(){dr.classList.remove('ordered');closeCart()});
  render();
})();
</script>
</body>
</html>
